apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyflick
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onlyflick
  template:
    metadata:
      labels:
        app: onlyflick
    spec:
      containers:
      - name: onlyflick
        image: ilan916/onlyflick-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres.ckzjonximwvlbkqhdkoo:OnlyFickproject3+-@aws-0-eu-west-3.pooler.supabase.com:6543/postgres"
        - name: PORT
          value: "8080"
        - name: DB_HOST
          value: "aws-0-eu-west-3.pooler.supabase.com"
        - name: DB_PORT
          value: "6543"
        - name: DB_USER
          value: "postgres.ckzjonximwvlbkqhdkoo"
        - name: DB_PASSWORD
          value: "OnlyFickproject3+-"
        - name: DB_NAME
          value: "postgres"
        - name: DB_TYPE
          value: "postgres"
        - name: ENV
          value: "production"
        - name: DB_SSLMODE
          value: "require"
        - name: JWT_SECRET
          value: "your-secret-key"
        - name: JWT_EXPIRATION
          value: "24"
        - name: CLOUDINARY_CLOUD_NAME
          value: "dafiqfwsf"
        - name: CLOUDINARY_API_KEY
          value: "491423787639739"
        - name: CLOUDINARY_API_SECRET
          value: "Sg2N_T7Zq63V49fMCh-oO52AefE"
        - name: CORS_ALLOWED_ORIGINS
          value: "http://localhost:3000,http://localhost:49219,http://127.0.0.1:3000,http://127.0.0.1:49219,http://127.0.0.1:35699,http://localhost:35699"
        - name: CORS_ALLOW_CREDENTIALS
          value: "true"
        - name: CORS_MAX_AGE
          value: "86400"
---
apiVersion: v1
kind: Service
metadata:
  name: onlyflick-service
spec:
  selector:
    app: onlyflick
  ports:
  - port: 80
    targetPort: 8080
  type: NodePort