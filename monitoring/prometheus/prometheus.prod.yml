global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'onlyflick-prod'
    environment: 'production'

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: '/metrics'

  - job_name: 'onlyflick-api'
    static_configs:
      - targets: ['api.yourdomain.com:8080']  # Remplacer par votre domaine
    scrape_interval: 10s
    metrics_path: '/metrics'
    scrape_timeout: 5s

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: '/metrics'

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 30s
    metrics_path: '/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']
    scrape_interval: 15s
    metrics_path: '/metrics'

  # Monitoring externe (optionnel)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://yourdomain.com
        - https://api.yourdomain.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v2

# Configuration pour la production
storage:
  tsdb:
    retention.time: 720h  # 30 jours
    retention.size: 10GB
    wal-compression: true

# Sécurité
web:
  enable-lifecycle: true
  enable-admin-api: true
  max-connections: 512
  read-timeout: 30s
