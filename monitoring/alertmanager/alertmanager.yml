global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'monitoring@onlyflick.com'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'

receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://host.docker.internal:8080/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'email'
    email_configs:
      - to: 'admin@onlyflick.com'
        subject: 'OnlyFlick Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
